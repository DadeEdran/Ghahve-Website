      <path d="M0 0v10M5 0v10" stroke="#7A5A32" stroke-opacity=".12" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#sBg)"/>
  <ellipse cx="400" cy="528" rx="330" ry="46" fill="#8A6E45" opacity=".18"/>

