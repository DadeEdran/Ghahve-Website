<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="گونی دانهٔ قهوه و دانه‌های ریخته‌شده">
  <defs>
    <linearGradient id="sBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6EFE3"/>
      <stop offset="1" stop-color="#E4D6BE"/>
    </linearGradient>
    <linearGradient id="burlap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D6B98C"/>
      <stop offset=".5" stop-color="#C09B69"/>
      <stop offset="1" stop-color="#9C7845"/>
