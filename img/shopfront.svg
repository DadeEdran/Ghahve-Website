<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="نمای بیرونی کافه با سایبان راه‌راه">
  <defs>
    <linearGradient id="fSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6EFE3"/>
      <stop offset="1" stop-color="#E6D8C0"/>
    </linearGradient>
    <linearGradient id="fWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E2E1E"/>
      <stop offset="1" stop-color="#241A11"/>
    </linearGradient>
    <linearGradient id="fGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5D8A2" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#D9A45E" stop-opacity=".85"/>
      <stop offset="1" stop-color="#8A5A2C" stop-opacity=".9"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#fSky)"/>
  <circle cx="120" cy="90" r="52" fill="#F7E3BB" opacity=".8"/>

  <!-- ساختمان -->
  <rect x="70" y="60" width="660" height="470" rx="8" fill="url(#fWall)"/>
  <rect x="70" y="60" width="660" height="18" rx="6" fill="#6B4A2F"/>
  <g stroke="#15100A" stroke-opacity=".35" stroke-width="3">
    <path d="M70 120h660"/>
  </g>

  <!-- تابلوی کافه -->
  <g transform="translate(400 152)">
    <rect x="-224" y="-42" width="448" height="84" rx="12" fill="#15100A" stroke="#C8963C" stroke-width="4"/>
    <g fill="#C8963C">
      <g transform="translate(-176 0) rotate(-16)"><ellipse rx="22" ry="15"/><path d="M-16 0c6-7 6 7 16-7" stroke="#15100A" stroke-width="3" fill="none"/></g>
    </g>
    <g stroke="#EBD6A6" stroke-width="10" stroke-linecap="round" opacity=".9">
      <path d="M-124 -10h248M-124 16h168"/>
    </g>
  </g>

  <!-- سایبان راه‌راه -->
  <g transform="translate(400 232)">
    <path d="M-268 0h536l30 78H-298Z" fill="#B23A2B"/>
    <g fill="#F1E6D0">
      <path d="M-268 0h56l-42 78h-56Z" opacity=".92"/>
      <path d="M-156 0h56l-42 78h-56Z" opacity=".92"/>
      <path d="M-44 0h56L-30 78h-56Z" opacity=".92"/>
      <path d="M68 0h56L82 78H26Z" opacity=".92"/>
      <path d="M180 0h56l-42 78h-56Z" opacity=".92"/>
    </g>
    <path d="M-298 78h596" stroke="#8E2A1E" stroke-width="10" stroke-linecap="round"/>
    <g fill="#8E2A1E">
      <path d="M-298 88h32l-16 22ZM-234 88h32l-16 22ZM-170 88h32l-16 22ZM-106 88h32l-16 22ZM-42 88h32l-16 22ZM22 88h32l-16 22ZM86 88h32l-16 22ZM150 88h32l-16 22ZM214 88h32l-16 22ZM266 88h32l-16 22Z" opacity=".8"/>
    </g>
  </g>

  <!-- ویترین -->
  <g>
    <rect x="118" y="352" width="252" height="178" rx="8" fill="url(#fGlass)"/>
    <rect x="118" y="352" width="252" height="178" rx="8" fill="none" stroke="#C8963C" stroke-width="6"/>
    <path d="M244 352v178M118 424h252" stroke="#C8963C" stroke-width="4" opacity=".7"/>
    <path d="M138 372 200 372 138 452Z" fill="#FFF6E0" opacity=".35"/>
