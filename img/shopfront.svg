    <rect x="452" y="352" width="120" height="96" rx="6" fill="url(#fGlass)"/>
    <circle cx="452" cy="470" r="8" fill="#C8963C"/>
    <rect x="470" y="470" width="86" height="12" rx="6" fill="#C8963C" opacity=".4"/>
