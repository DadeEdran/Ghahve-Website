  <g transform="translate(230 530)">
    <ellipse rx="46" ry="9" fill="#8A6E45" opacity=".3"/>
    <rect x="-38" y="-72" width="76" height="10" rx="5" fill="#6B4A2F"/>
    <path d="M0 -62v52M-22 -10h44" stroke="#4A3524" stroke-width="7" stroke-linecap="round"/>
    <g transform="translate(-64 0)">
      <rect x="-20" y="-52" width="40" height="8" rx="4" fill="#6B4A2F"/>
      <path d="M-14 -44v40M14 -44v40M-16 -50v-26h32" stroke="#4A3524" stroke-width="6" stroke-linecap="round" fill="none"/>
    </g>
    <g transform="translate(64 0)">
      <rect x="-20" y="-52" width="40" height="8" rx="4" fill="#6B4A2F"/>
      <path d="M-14 -44v40M14 -44v40M16 -50v-26h-32" stroke="#4A3524" stroke-width="6" stroke-linecap="round" fill="none"/>
    </g>
    <g transform="translate(0 -76)">
      <path d="M-12 0h24v10a8 8 0 0 1-8 8h-8a8 8 0 0 1-8-8Z" fill="#F1E6D0"/>
      <ellipse ry="3" rx="12" fill="#6B4423"/>
    </g>
