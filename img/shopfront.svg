    <path d="M-22 32h44l-7 36h-30Z" fill="#B23A2B"/>
  </g>

  <!-- پیاده‌رو -->
  <rect y="530" width="800" height="70" fill="#D3C2A6"/>
  <g stroke="#B8A587" stroke-width="4">
    <path d="M0 552h800M0 578h800M110 530v70M270 530v70M430 530v70M590 530v70M740 530v70"/>
