  <!-- تخته‌سیاه منو -->
  <g transform="translate(660 452)">
    <rect x="-46" y="-70" width="92" height="112" rx="6" fill="#15100A" stroke="#6B4A2F" stroke-width="7"/>
    <g stroke="#EBD6A6" stroke-opacity=".6" stroke-width="6" stroke-linecap="round">
      <path d="M-28 -44h56M-28 -22h38M-28 0h50M-28 22h30"/>
    </g>
    <path d="M-30 42 -44 96M30 42 44 96" stroke="#6B4A2F" stroke-width="9" stroke-linecap="round"/>
