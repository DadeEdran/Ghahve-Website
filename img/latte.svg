      <ellipse rx="26" ry="18"/><path d="M-20 0c8-8 8 8 20-8" stroke="#6B4423" stroke-width="3" fill="none"/>
    </g>
    <g transform="translate(140 528) rotate(14)">
      <ellipse rx="24" ry="17"/><path d="M-18 0c7-7 7 7 18-7" stroke="#6B4423" stroke-width="3" fill="none"/>
    </g>
    <g transform="translate(520 118) rotate(32)">
      <ellipse rx="25" ry="18"/><path d="M-19 0c7-7 7 7 19-7" stroke="#6B4423" stroke-width="3" fill="none"/>
    </g>
  </g>

  <!-- قاشق -->
  <g transform="translate(492 400) rotate(-32)">
    <ellipse rx="24" ry="34" fill="#C9AE7E"/>
    <rect x="-6" y="30" width="12" height="120" rx="6" fill="#C9AE7E"/>
    <ellipse rx="16" ry="24" fill="#A88F63" opacity=".55"/>
