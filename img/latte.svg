  <!-- نعلبکی -->
  <ellipse cx="300" cy="312" rx="212" ry="206" fill="#0F0A06" opacity=".35"/>
  <circle cx="296" cy="304" r="206" fill="#EFE4D2"/>
  <circle cx="296" cy="304" r="206" fill="none" stroke="#D6C6AC" stroke-width="4"/>
  <circle cx="296" cy="304" r="168" fill="#E5D7BF"/>

