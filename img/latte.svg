  <g fill="#F4E9D6">
    <path d="M296 194c-9 22-13 46-13 70 0 46 6 82 13 116 7-34 13-70 13-116 0-24-4-48-13-70Z" opacity=".97"/>
    <path d="M296 230c-22-4-42 6-54 24 18 12 40 12 54 2Zm0 0c22-4 42 6 54 24-18 12-40 12-54 2Z"/>
    <path d="M296 272c-25-5-48 6-62 27 21 14 46 14 62 2Zm0 0c25-5 48 6 62 27-21 14-46 14-62 2Z"/>
