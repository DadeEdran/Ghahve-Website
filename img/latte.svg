<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="فنجان لاته با نقش برگ روی میز چوبی">
  <defs>
    <linearGradient id="lWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6B4A2F"/>
      <stop offset=".5" stop-color="#4A3220"/>
      <stop offset="1" stop-color="#2E1F12"/>
    </linearGradient>
    <radialGradient id="lCrema" cx=".38" cy=".32" r=".78">
      <stop offset="0" stop-color="#C08A4E"/>
      <stop offset=".6" stop-color="#8B5A2E"/>
      <stop offset="1" stop-color="#5E3A1C"/>
    </radialGradient>
    <radialGradient id="lLight" cx=".3" cy=".2" r=".8">
      <stop offset="0" stop-color="#FFE7B8" stop-opacity=".28"/>
      <stop offset="1" stop-color="#FFE7B8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="600" fill="url(#lWood)"/>
  <g stroke="#2A1B0F" stroke-opacity=".45" stroke-width="3" fill="none">
