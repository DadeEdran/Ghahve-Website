  <path d="M424 288c46 0 46 66 0 66" stroke="#F7F1E4" stroke-width="26" fill="none" stroke-linecap="round"/>
  <path d="M424 288c46 0 46 66 0 66" stroke="#D8CAB2" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- فنجان -->
  <circle cx="296" cy="304" r="150" fill="#F7F1E4"/>
  <circle cx="296" cy="304" r="132" fill="#E0D2B8"/>
  <circle cx="296" cy="304" r="124" fill="url(#lCrema)"/>

